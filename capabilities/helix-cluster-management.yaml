name: Apache Helix Cluster Management
description: Workflow capability for managing distributed cluster resources and partition state in Apache Helix
persona: Platform Engineer
workflow:
  - step: list-clusters
    name: List Clusters
    description: Discover all Helix clusters under management
    capability: helix-rest
    operation: listClusters
    server:
      rest: http://localhost:9100
      mcp: http://localhost:9090

  - step: get-cluster
    name: Get Cluster
    description: Inspect configuration and live instances of a cluster
    capability: helix-rest
    operation: getCluster
    server:
      rest: http://localhost:9100
      mcp: http://localhost:9090

  - step: list-resources
    name: List Resources
    description: List all managed resources in the cluster
    capability: helix-rest
    operation: listResources
    server:
      rest: http://localhost:9100
      mcp: http://localhost:9090

  - step: get-external-view
    name: Get External View
    description: Check actual partition state assignments for a resource
    capability: helix-rest
    operation: getExternalView
    server:
      rest: http://localhost:9100
      mcp: http://localhost:9090

tools:
  - name: listClusters
    description: List all Helix clusters
    server:
      rest:
        baseUrl: http://localhost:9100
        path: /clusters
        method: GET
      mcp:
        baseUrl: http://localhost:9090
        path: /tools/listClusters
        method: POST

  - name: getCluster
    description: Get cluster configuration and status
    server:
      rest:
        baseUrl: http://localhost:9100
        path: /clusters/{clusterId}
        method: GET
      mcp:
        baseUrl: http://localhost:9090
        path: /tools/getCluster
        method: POST

  - name: listResources
    description: List resources in a Helix cluster
    server:
      rest:
        baseUrl: http://localhost:9100
        path: /clusters/{clusterId}/resources
        method: GET
      mcp:
        baseUrl: http://localhost:9090
        path: /tools/listResources
        method: POST

  - name: getExternalView
    description: Get actual partition state assignments
    server:
      rest:
        baseUrl: http://localhost:9100
        path: /clusters/{clusterId}/resources/{resourceName}/externalView
        method: GET
      mcp:
        baseUrl: http://localhost:9090
        path: /tools/getExternalView
        method: POST

  - name: listInstances
    description: List instances in a Helix cluster
    server:
      rest:
        baseUrl: http://localhost:9100
        path: /clusters/{clusterId}/instances
        method: GET
      mcp:
        baseUrl: http://localhost:9090
        path: /tools/listInstances
        method: POST
