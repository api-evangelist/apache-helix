name: Apache Helix REST API
description: Shared capability definitions for Apache Helix REST API cluster management operations
baseUrl: http://localhost:9100
transport: rest
version: "1.0.0"
operations:
  - operationId: listClusters
    name: Apache Helix List Clusters
    description: List all Helix clusters managed by this controller
    method: GET
    path: /clusters
    tags:
      - Clusters

  - operationId: getCluster
    name: Apache Helix Get Cluster
    description: Get configuration and status of a specific Helix cluster
    method: GET
    path: /clusters/{clusterId}
    parameters:
      - name: clusterId
        in: path
        required: true
        type: string
    tags:
      - Clusters

  - operationId: listResources
    name: Apache Helix List Resources
    description: List all resources managed in a Helix cluster
    method: GET
    path: /clusters/{clusterId}/resources
    parameters:
      - name: clusterId
        in: path
        required: true
        type: string
    tags:
      - Resources

  - operationId: getExternalView
    name: Apache Helix Get External View
    description: Get current partition state assignments across instances
    method: GET
    path: /clusters/{clusterId}/resources/{resourceName}/externalView
    parameters:
      - name: clusterId
        in: path
        required: true
        type: string
      - name: resourceName
        in: path
        required: true
        type: string
    tags:
      - State

  - operationId: listInstances
    name: Apache Helix List Instances
    description: List all instances registered in a Helix cluster
    method: GET
    path: /clusters/{clusterId}/instances
    parameters:
      - name: clusterId
        in: path
        required: true
        type: string
    tags:
      - Instances
